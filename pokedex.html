<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedéx Ultra</title>
    <link rel="pokemon icon" href="https://cdn.icon-icons.com/icons2/851/PNG/512/Pokedex_tool_icon-icons.com_67529.png" type="image/x-icon">
    <style>
        #pokemon-image{
    height: 350px;
    width: 350px;
}

body{
    margin: 0;
}

#banner{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 360px;
    width: 100%;
    background-color: rgb(192, 79, 79);
}

.info{
    margin-top: 20px;
    margin-bottom: 20px;
    padding-left:10px;
    padding-right:10px;
    border: 2px dashed black;
    border-radius: 10%;
    background-color: white;
    width: 230px;


}

#corpo{
    display: flex;
    flex-direction: column;
    text-align: center;
    align-items: center;
    background-color: #000;

}

::placeholder {
    color: rgb(255, 255, 255);}
    </style>

</head>
<body>
<div id="corpo">
    <div id="banner">
        <h1>Pokedéx Ultra</h1>
        <img id="pokemon-image" src="https://64.media.tumblr.com/f4918498af34c8764de970a2ca76795b/tumblr_mvzj2elEQA1rfjowdo1_500.gif" alt="pokeball gif">
        
    </div>
    
        <input class="info" style="border-radius: 0%; background-color: grey; height: 30px;" type="search" id="search" placeholder="Search a pokemon..." >
        
    
    
</div>  
 <script>
     let corpo = document.getElementById("corpo");
let pila = document.getElementById('search');

// Função para processar o evento de teclado
function handleKeyPress(event) {
  // Obtém o valor da tecla pressionada
  let key = event.key;

  // Verifica se a tecla pressionada é um número, operador ou tecla especial
  if (/Enter/i.test(key)) {

    // Chama a função atualizar com o valor correspondente à tecla pressionada
    search();
  }

}

// Adiciona um ouvinte de eventos de teclado ao documento
document.addEventListener('keydown', handleKeyPress);

function search() {
  pila = document.getElementById('search').value
  pila = pila.toLowerCase();

    fetch(`https://pokeapi.co/api/v2/pokemon/${pila}`)
      .then(response => response.json())
      .then(data => {
        const name = data.name;
        const id = data.id;
        const height = data.height;
        const weight = data.weight;
        const image = data.sprites.front_default;
        let type = [];

        data.types.forEach(item => {
          type.push(item.type.name);
        });

        corpo.innerHTML = `
        <div id="banner">
        <img src="${image}" alt="Imagem de ${name}" id="pokemon-image">
        </div>
        <div class="info">
          <h1>Name: ${name}</h1>
          <h2 class="id">Id: ${id}</h2>
          <h3 class="type">Type: ${type.join(', ')}</h3>
          <h3 class="altua">Height: ${height}</h3>
          <h3 class="peso">Weight: ${weight}</h3>
          </div>
        `;
      })
      .catch(error => console.error('Error fetching data:', error));


}



 </script>
</body>
</html>
