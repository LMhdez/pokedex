<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedéx Ultra</title>
    <link rel="pokemon icon" href="https://cdn.icon-icons.com/icons2/851/PNG/512/Pokedex_tool_icon-icons.com_67529.png" type="image/x-icon">
    <style>
        #pokemon-image{
    height: 350px;
    width: 350px;
}

body{
    margin: 0;
}

#banner{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 360px;
    width: 100%;
    background-color: rgb(192, 79, 79);
}

.info{
    margin-top: 20px;
    margin-bottom: 20px;
    padding-left:10px;
    padding-right:10px;
    border: 2px dashed black;
    border-radius: 10%;
    background-color: white;
    width: 230px;


}

#corpo{
    display: flex;
    flex-direction: column;
    text-align: center;
    align-items: center;
    background-color: #000;

}

::placeholder {
    color: rgb(255, 255, 255);}
    </style>

</head>
<body>
<div id="corpo">
    <div id="banner">
        <h1>Pokedéx Ultra</h1>
        <img id="pokemon-image" src="https://64.media.tumblr.com/f4918498af34c8764de970a2ca76795b/tumblr_mvzj2elEQA1rfjowdo1_500.gif" alt="pokeball gif">
        
    </div>
    
        <input class="info" style="border-radius: 0%; background-color: grey; height: 30px;" type="search" id="search" placeholder="Search a pokemon..." >
        <div id="results"></div>
        
    
    
</div>  
 <script>
const searchInput = document.getElementById("search");
const results = document.getElementById("results");

searchInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    search();
  }
});

async function search() {
  const query = searchInput.value.trim().toLowerCase();
  if (!query) return;

  try {
    const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(query)}`);
    if (!response.ok) {
      throw new Error("Pokémon not found");
    }

    const data = await response.json();
    const banner = document.createElement("div");
    banner.id = "banner";

    const image = document.createElement("img");
    image.id = "pokemon-image";
    image.alt = `Image of ${data.name}`;
    if (data.sprites.front_default) {
      image.src = data.sprites.front_default;
    }
    banner.appendChild(image);

    const info = document.createElement("div");
    info.className = "info";

    const details = [
      ["h1", `Name: ${data.name}`],
      ["h2", `Id: ${data.id}`],
      ["h3", `Type: ${data.types.map(item => item.type.name).join(", ")}`],
      ["h3", `Height: ${data.height}`],
      ["h3", `Weight: ${data.weight}`]
    ];

    for (const [tag, value] of details) {
      const element = document.createElement(tag);
      element.textContent = value;
      info.appendChild(element);
    }

    results.replaceChildren(banner, info);
  } catch {
    const message = document.createElement("p");
    message.className = "info";
    message.textContent = "Pokémon not found. Check the name or number and try again.";
    results.replaceChildren(message);
  }
}
</script>
</body>
</html>
